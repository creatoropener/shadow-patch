name: Engine Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile Python sources
        run: >-
          python -m py_compile proof.py runtimes.py tools/export_target.py
          patchproof_runtime/typescript_check.py

      - name: Run runtime contract tests
        run: python -m unittest discover -s tests -v

      - name: Check JavaScript helpers
        run: |
          node --check patchproof_runtime/static_web_check.mjs
          node --check patchproof_runtime/typescript_test_lint.mjs
          node --check patchproof_runtime/web_streams.mjs
          node --test tests/test_web_streams.mjs
