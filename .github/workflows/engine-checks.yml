name: Engine Checks

on:
  push:
  pull_request:

permissions:
  contents: write  # Updated to allow the workflow to push commits if needed

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile Python sources
        run: >-
          python -m py_compile proof.py runtimes.py tools/export_target.py
          patchproof_runtime/typescript_check.py

      - name: Install pinned compiler for linter integration tests
        run: npm install --prefix "$RUNNER_TEMP/patchproof-lint" --ignore-scripts --no-audit --no-fund typescript@5.6.3

      - name: Run runtime contract tests
        run: TS_LINT_NODE_MODULES="$RUNNER_TEMP/patchproof-lint/node_modules" python -m unittest discover -s tests -v

      - name: Check JavaScript helpers
        run: |
          node --check patchproof_runtime/static_web_check.mjs
          node --check patchproof_runtime/typescript_test_lint.mjs
          node --check patchproof_runtime/web_streams.mjs
          node --test tests/test_web_streams.mjs

  sync-to-target:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout shadow-patch
        uses: actions/checkout@v4
        with:
          path: shadow-patch

      - name: Checkout file-sharing-app
        uses: actions/checkout@v4
        with:
          repository: 'creatoropener/file-sharing-app'
          token: ${{ secrets.SYNC_TARGET_TOKEN }}          
          path: file-sharing-app
          persist-credentials: false # <-- Crucial addition: prevents overriding credentials

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run export script
        run: |
          cd shadow-patch
          python3 tools/export_target.py --output ../patch_delivery.zip

      - name: Extract package over file-sharing-app root
        run: |
          unzip -o patch_delivery.zip -d file-sharing-app/

      - name: Commit and push updates to file-sharing-app
        run: |
          cd file-sharing-app
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@://github.com"
          
          git add runtimes.py proof.py requirements-patchproof.txt patchproof_runtime/ .github/workflows/
          
          if ! git diff --cached --quiet; then
            git commit -m "Automated sync: updated engine files from shadow-patch (${{ github.sha }})"
            
            # Added the correct 'http.' prefix section to resolve the git config error
            git config http.extraheader "Authorization: Basic $(echo -n 'x-access-token:${{ secrets.SYNC_TARGET_TOKEN }}' | base64)"
            
            git push origin HEAD:main
          else
            echo "No changes detected. Skipping deployment."
          fi
