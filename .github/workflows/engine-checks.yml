name: Engine Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-patchproof.txt

      - name: Install PatchProof dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-patchproof.txt pyyaml==6.0.3 pytest==8.3.5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compile Python sources
        run: >-
          python -m py_compile proof.py runtimes.py scope_policy.py agent_budget.py context_tools.py agent_loop.py tools/export_target.py tools/pr_files.py
          patchproof_runtime/typescript_check.py patchproof_runtime/typescript_source_check.py

      - name: Install pinned compiler for linter integration tests
        run: npm install --prefix "$RUNNER_TEMP/patchproof-lint" --ignore-scripts --no-audit --no-fund typescript@5.6.3 @types/node@20.17.30 tsx@4.20.6

      - name: Run runtime contract tests
        run: TS_LINT_NODE_MODULES="$RUNNER_TEMP/patchproof-lint/node_modules" python -m unittest discover -s tests -v

      - name: Check JavaScript helpers
        run: |
          node --check patchproof_runtime/static_web_check.mjs
          node --check patchproof_runtime/typescript_test_lint.mjs
          node --check patchproof_runtime/candidate_policy.mjs
          node --check patchproof_runtime/web_streams.mjs
          node --test tests/test_web_streams.mjs
